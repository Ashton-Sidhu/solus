name: Release Server

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    environment: CD
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: darwin
            arch: arm64
          - platform: linux
            arch: x64
          - platform: linux
            arch: arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      # The headless package does not need Electron or desktop postinstall hooks.
      - name: Cache dependency downloads
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: deps-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            deps-${{ runner.os }}-${{ runner.arch }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Package headless server
        env:
          SOLUS_GOOGLE_CLIENT_ID: ${{ secrets.SOLUS_GOOGLE_CLIENT_ID }}
          SOLUS_GOOGLE_CLIENT_SECRET: ${{ secrets.SOLUS_GOOGLE_CLIENT_SECRET }}
          SOLUS_GITHUB_CLIENT_ID: ${{ secrets.SOLUS_GITHUB_CLIENT_ID }}
          SOLUS_ATLASSIAN_CLIENT_ID: ${{ secrets.SOLUS_ATLASSIAN_CLIENT_ID }}
          SOLUS_ATLASSIAN_CLIENT_SECRET: ${{ secrets.SOLUS_ATLASSIAN_CLIENT_SECRET }}
        run: bun scripts/package-server.ts --headless --platform ${{ matrix.platform }} --arch ${{ matrix.arch }}

      # Keep the public names used by the installer and server updater.
      - name: Use the standard release archive name
        run: mv release/solus-server-headless-${{ matrix.platform }}-${{ matrix.arch }}.tar.gz release/solus-server-${{ matrix.platform }}-${{ matrix.arch }}.tar.gz

      - name: Upload packaged server
        uses: actions/upload-artifact@v4
        with:
          name: solus-server-${{ matrix.platform }}-${{ matrix.arch }}
          path: release/solus-server-${{ matrix.platform }}-${{ matrix.arch }}.tar.gz
          if-no-files-found: error

  publish:
    runs-on: ubuntu-latest
    needs: package
    steps:
      - name: Download packaged servers
        uses: actions/download-artifact@v4
        with:
          path: release

      - name: Write SHA256SUMS
        run: |
          cd release
          find . -name 'solus-server-*.tar.gz' -type f -print0 | sort -z | xargs -0 sha256sum | sed 's#  ./[^/]*/#  #' > SHA256SUMS

      - name: Checkout Solus
        uses: actions/checkout@v4
        with:
          path: solus

      - name: Publish server artifacts
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/**/*.tar.gz
            release/SHA256SUMS
            solus/scripts/install.sh
          generate_release_notes: true
