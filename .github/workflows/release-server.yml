name: Release Server

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    environment: CD
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: darwin
            arch: arm64
          - platform: linux
            arch: x64
          - platform: linux
            arch: arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      # setup-bun caches the bun binary, not the packages it downloads. Without
      # these, every run refetches the whole dependency set plus the ~100 MB
      # Electron binary that `postinstall` pulls down.
      - name: Cache dependency downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            ~/.cache/electron
            ~/.cache/electron-builder
          key: deps-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            deps-${{ runner.os }}-${{ runner.arch }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build app and web client
        run: bun run build

      - name: Package server
        env:
          SOLUS_GOOGLE_CLIENT_ID: ${{ secrets.SOLUS_GOOGLE_CLIENT_ID }}
          SOLUS_GOOGLE_CLIENT_SECRET: ${{ secrets.SOLUS_GOOGLE_CLIENT_SECRET }}
          SOLUS_GITHUB_CLIENT_ID: ${{ secrets.SOLUS_GITHUB_CLIENT_ID }}
          SOLUS_ATLASSIAN_CLIENT_ID: ${{ secrets.SOLUS_ATLASSIAN_CLIENT_ID }}
          SOLUS_ATLASSIAN_CLIENT_SECRET: ${{ secrets.SOLUS_ATLASSIAN_CLIENT_SECRET }}
        run: bun scripts/package-server.ts --platform ${{ matrix.platform }} --arch ${{ matrix.arch }}

      - name: Upload packaged server
        uses: actions/upload-artifact@v4
        with:
          name: solus-server-${{ matrix.platform }}-${{ matrix.arch }}
          path: release/solus-server-${{ matrix.platform }}-${{ matrix.arch }}.tar.gz
          if-no-files-found: error

  publish:
    runs-on: ubuntu-latest
    needs: package
    steps:
      - name: Download packaged servers
        uses: actions/download-artifact@v4
        with:
          path: release

      - name: Write SHA256SUMS
        run: |
          cd release
          find . -name 'solus-server-*.tar.gz' -type f -print0 | sort -z | xargs -0 sha256sum | sed 's#  ./[^/]*/#  #' > SHA256SUMS

      - name: Checkout Solus
        uses: actions/checkout@v4
        with:
          path: solus

      - name: Publish server artifacts
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/**/*.tar.gz
            release/SHA256SUMS
            solus/scripts/install.sh
          generate_release_notes: true
