name: Release Server

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  # The image that runs a published app (docs/plans/app-deploy.md §5.1). It is
  # the same for each app, and a host pulls the one of its own release at its
  # first publish. The bundle is JavaScript only, so one build serves both
  # architectures.
  apps-runtime-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Build the image's files
        run: bun scripts/build-apps-runtime.ts

      - name: Setup QEMU
        uses: docker/setup-qemu-action@v3

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v3

      - name: Sign in to the registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The tag is the version of package.json, which the server asks for. A
      # release tag is `v<version>`.
      - name: Read the version
        id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: dist/apps-runtime
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/ashton-sidhu/solus-apps-runtime:${{ steps.version.outputs.version }}
            ghcr.io/ashton-sidhu/solus-apps-runtime:latest
          labels: |
            org.opencontainers.image.source=https://github.com/Ashton-Sidhu/solus
            org.opencontainers.image.description=The runtime of a published Solus app
            org.opencontainers.image.version=${{ steps.version.outputs.version }}

  package:
    runs-on: ${{ matrix.runner }}
    environment: CD
    strategy:
      fail-fast: false
      matrix:
        include:
          # The resource monitor links against macOS, so this target packages
          # on macOS. Linux targets are static musl and cross-link anywhere.
          - platform: darwin
            arch: arm64
            runner: macos-latest
            archive: tar.gz
          - platform: linux
            arch: x64
            runner: ubuntu-latest
            archive: tar.gz
          - platform: linux
            arch: arm64
            runner: ubuntu-latest
            archive: tar.gz
          # Windows' own tar writes the zip, and npm runs through the
          # downloaded node.exe, so this target packages on Windows. x64 only
          # (docs/plans/windows.md §6).
          - platform: win32
            arch: x64
            runner: windows-latest
            archive: zip

    steps:
      # Git for Windows turns core.autocrlf on. The package must carry the
      # files as the repository has them.
      - name: Keep LF line endings
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      # The headless package does not need Electron or desktop postinstall hooks.
      - name: Cache dependency downloads
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: deps-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            deps-${{ runner.os }}-${{ runner.arch }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Setup Rust for the resource monitor
        uses: dtolnay/rust-toolchain@stable

      - name: Package headless server
        env:
          SOLUS_GOOGLE_CLIENT_ID: ${{ secrets.SOLUS_GOOGLE_CLIENT_ID }}
          SOLUS_GOOGLE_CLIENT_SECRET: ${{ secrets.SOLUS_GOOGLE_CLIENT_SECRET }}
          SOLUS_GITHUB_CLIENT_ID: ${{ secrets.SOLUS_GITHUB_CLIENT_ID }}
          SOLUS_ATLASSIAN_CLIENT_ID: ${{ secrets.SOLUS_ATLASSIAN_CLIENT_ID }}
          SOLUS_ATLASSIAN_CLIENT_SECRET: ${{ secrets.SOLUS_ATLASSIAN_CLIENT_SECRET }}
        run: bun scripts/package-server.ts --headless --platform ${{ matrix.platform }} --arch ${{ matrix.arch }}

      # Keep the public names used by the installer and server updater.
      - name: Use the standard release archive name
        shell: bash
        run: mv release/solus-server-headless-${{ matrix.platform }}-${{ matrix.arch }}.${{ matrix.archive }} release/solus-server-${{ matrix.platform }}-${{ matrix.arch }}.${{ matrix.archive }}

      - name: Upload packaged server
        uses: actions/upload-artifact@v4
        with:
          name: solus-server-${{ matrix.platform }}-${{ matrix.arch }}
          path: release/solus-server-${{ matrix.platform }}-${{ matrix.arch }}.${{ matrix.archive }}
          if-no-files-found: error

  publish:
    runs-on: ubuntu-latest
    needs: package
    steps:
      # Only the server archives: the image job's build also uploads a
      # `.dockerbuild` record, which download-artifact cannot extract.
      - name: Download packaged servers
        uses: actions/download-artifact@v4
        with:
          path: release
          pattern: solus-server-*

      # One SHA256SUMS for every archive: install.sh, install.ps1, and the
      # updater all read it.
      - name: Write SHA256SUMS
        run: |
          cd release
          find . \( -name 'solus-server-*.tar.gz' -o -name 'solus-server-*.zip' \) -type f -print0 | sort -z | xargs -0 sha256sum | sed 's#  ./[^/]*/#  #' > SHA256SUMS

      - name: Checkout Solus
        uses: actions/checkout@v4
        with:
          path: solus

      - name: Publish server artifacts
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/**/*.tar.gz
            release/**/*.zip
            release/SHA256SUMS
            solus/scripts/install.sh
            solus/scripts/install.ps1
          generate_release_notes: true
