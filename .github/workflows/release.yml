name: Release

on:
  push:
    branches: [main]
    tags:
      - 'v*'
    paths:
      - '.github/workflows/release.yml'
      - 'native/transcription/**'
      - 'scripts/beforePack.js'
      - 'scripts/build-transcription.ts'
  workflow_dispatch:
    inputs:
      release_tag:
        description: Latest published release to retry on Windows and Linux
        type: string
      verify_only:
        description: Build all desktop packages from main without publishing
        type: boolean

concurrency:
  group: ${{ (github.event_name == 'push' && github.ref_type == 'branch' || inputs.verify_only) && 'desktop-release-verification' || 'desktop-release' }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  VULKAN_SDK_VERSION: '1.4.304.1'

jobs:
  prepare-release:
    runs-on: ubuntu-22.04
    environment: CD
    steps:
      - name: Check the retry target
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          VERIFY_ONLY: ${{ inputs.verify_only }}
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/$DEFAULT_BRANCH" ]]; then
            echo 'Run a release retry from the default branch.' >&2
            exit 1
          fi
          if [[ "$VERIFY_ONLY" == 'true' ]]; then
            if [[ -n "$RELEASE_TAG" ]]; then
              echo 'Leave the release tag empty for a verification build.' >&2
              exit 1
            fi
            exit 0
          fi
          latest=$(gh release view --json tagName --jq .tagName)
          if [[ "$RELEASE_TAG" != "$latest" ]]; then
            echo "Only the latest published release ($latest) can update the desktop feeds." >&2
            exit 1
          fi
      - uses: actions/checkout@v4
        if: github.ref_type == 'tag'
      - uses: oven-sh/setup-bun@v2
        if: github.ref_type == 'tag'
      - name: Publish pinned voice model
        if: github.ref_type == 'tag'
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: bun scripts/publish-voice-model.ts

  build-web:
    needs: prepare-release
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag && format('refs/tags/{0}', inputs.release_tag) || github.sha }}
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: Build shared web bundle
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: |
          /usr/bin/time -f 'Web bundle: %e seconds, %M KiB peak RSS' bun run build:client
          test -s dist/client/index.html
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-web
          path: dist/client/
          if-no-files-found: error

  build-mac:
    if: github.event_name == 'push' || inputs.verify_only
    needs: build-web
    runs-on: macos-latest
    timeout-minutes: 60
    environment: CD
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      # setup-bun caches the bun binary, not the packages it downloads. Without
      # these, every run refetches the whole dependency set plus the ~100 MB
      # Electron binary that `postinstall` pulls down.
      - name: Cache dependency downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
          key: deps-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            deps-${{ runner.os }}-${{ runner.arch }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Setup Rust for the resource monitor
        uses: dtolnay/rust-toolchain@stable

      - &voice-image
        name: Read the runner image family
        id: voice-image
        shell: bash
        run: |
          if [[ "$RUNNER_OS" != 'macOS' && -z "$VULKAN_SDK" ]]; then
            echo 'The release voice helper requires the Vulkan SDK.' >&2
            exit 1
          fi
          echo "family=${ImageOS:?}" >> "$GITHUB_OUTPUT"
      - &voice-cache
        name: Cache native voice helper
        id: voice-cache
        uses: actions/cache@v4
        with:
          path: build/transcription/bin
          # Release tags can restore this exact cache from main. Keep different
          # platforms, runner image families, and SDK pins in separate entries.
          key: voice-helper-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.voice-image.outputs.family }}-${{ env.VULKAN_SDK_VERSION }}-${{ hashFiles('native/transcription/**', 'scripts/build-transcription.ts') }}
      - &download-web
        name: Download shared web bundle
        uses: actions/download-artifact@v4
        with:
          name: desktop-web
          path: dist/client

      - name: Import code signing certificate
        if: github.ref_type == 'tag'
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PWD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
        run: |
          echo "$MACOS_CERTIFICATE" | base64 --decode > certificate.p12
          KEYCHAIN_PATH=$RUNNER_TEMP/build.keychain
          security create-keychain -p "" $KEYCHAIN_PATH
          security default-keychain -s $KEYCHAIN_PATH
          security unlock-keychain -p "" $KEYCHAIN_PATH
          # A new keychain relocks after 5 idle minutes. When the build runs longer,
          # codesign waits on an unlock prompt that a headless runner never answers.
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security import certificate.p12 -k $KEYCHAIN_PATH -P "$MACOS_CERTIFICATE_PWD" -T /usr/bin/codesign -T /usr/bin/productsign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "" $KEYCHAIN_PATH
          security list-keychains -d user -s $KEYCHAIN_PATH login.keychain
          rm certificate.p12

      - name: Write .env.production
        if: github.ref_type == 'tag'
        run: |
          echo "VITE_POSTHOG_KEY=${{ secrets.VITE_POSTHOG_KEY }}" > .env.production
          echo "SOLUS_GOOGLE_CLIENT_ID=${{ secrets.SOLUS_GOOGLE_CLIENT_ID }}" >> .env.production
          echo "SOLUS_GOOGLE_CLIENT_SECRET=${{ secrets.SOLUS_GOOGLE_CLIENT_SECRET }}" >> .env.production
          echo "SOLUS_GITHUB_CLIENT_ID=${{ secrets.SOLUS_GITHUB_CLIENT_ID }}" >> .env.production
          echo "SOLUS_ATLASSIAN_CLIENT_ID=${{ secrets.SOLUS_ATLASSIAN_CLIENT_ID }}" >> .env.production
          echo "SOLUS_ATLASSIAN_CLIENT_SECRET=${{ secrets.SOLUS_ATLASSIAN_CLIENT_SECRET }}" >> .env.production

      # electron-builder folds `build/release-notes.md` into the update feed
      # manifest (latest-mac.yml), which is where the app reads release notes
      # from. GitHub generates the same notes the release below will show.
      - name: Write release notes for the update feed
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p build
          gh api "repos/${{ github.repository }}/releases/generate-notes" \
            -f tag_name="${{ github.ref_name }}" \
            --jq '.body' > build/release-notes.md || : > build/release-notes.md

      - name: Configure the macOS web bundle
        env:
          WEB_ANALYTICS_KEY: ${{ github.ref_type == 'tag' && secrets.VITE_POSTHOG_KEY || '' }}
        run: |
          node <<'JS'
          const fs = require('node:fs')
          const key = process.env.WEB_ANALYTICS_KEY
          if (!key) process.exit(0)
          const path = 'dist/client/index.html'
          const html = fs.readFileSync(path, 'utf8')
          if (!html.includes('<head>')) throw new Error('Shared web bundle has no head element')
          const escaped = key.replaceAll('&', '&amp;').replaceAll('"', '&quot;').replaceAll('<', '&lt;').replaceAll('>', '&gt;')
          fs.writeFileSync(path, html.replace('<head>', () => `<head>\n<meta name="solus-analytics-key" content="${escaped}">`))
          JS

      - name: Build Electron app
        env:
          NODE_OPTIONS: --max-old-space-size=4096
          SOLUS_VOICE_CACHE_HIT: ${{ steps.voice-cache.outputs.cache-hit }}
          # electron-builder logs a single line for signing and a single line for
          # notarization, so the whole block is opaque in CI. These make the split
          # between codesign and Apple's notary service visible in the job log.
          DEBUG: electron-osx-sign*,electron-notarize*
          APPLE_ID: ${{ github.ref_type == 'tag' && secrets.APPLE_ID || '' }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ github.ref_type == 'tag' && secrets.APPLE_APP_SPECIFIC_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ github.ref_type == 'tag' && secrets.APPLE_TEAM_ID || '' }}
          CSC_KEYCHAIN: ${{ github.ref_type == 'tag' && format('{0}/build.keychain', runner.temp) || '' }}
          IS_TAG_RELEASE: ${{ github.ref_type == 'tag' }}
        run: |
          /usr/bin/time -l bun run electron-vite build --logLevel warn --mode production
          if [[ "$IS_TAG_RELEASE" == 'true' ]]; then
            bun run electron-builder --mac --publish never
          else
            bun run electron-builder --mac --publish never --config.mac.identity=null
          fi

      - name: Create GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.dmg
          generate_release_notes: true

      - name: Upload to Cloudflare R2
        if: github.ref_type == 'tag'
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          export AWS_ACCESS_KEY_ID=$R2_ACCESS_KEY_ID
          export AWS_SECRET_ACCESS_KEY=$R2_SECRET_ACCESS_KEY
          export AWS_DEFAULT_REGION=auto

          R2_ENDPOINT="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"

          for f in release/*.dmg release/*.zip release/*.yml release/*.blockmap; do
            [ -f "$f" ] || continue
            echo "Uploading $(basename $f)..."
            aws s3 cp "$f" "s3://solus-releases/$(basename $f)" \
              --endpoint-url "$R2_ENDPOINT"
          done

          DMG=$(ls release/*-arm64.dmg 2>/dev/null | head -1)
          if [ -n "$DMG" ]; then
            echo "Uploading stable download link..."
            aws s3 cp "$DMG" "s3://solus-releases/Solus-latest-arm64.dmg" \
              --endpoint-url "$R2_ENDPOINT"
          fi

      - name: Checkout tap repo
        if: github.ref_type == 'tag' && !contains(github.ref_name, '-')
        uses: actions/checkout@v4
        with:
          repository: Ashton-Sidhu/homebrew-tap
          token: ${{ secrets.TAP_GITHUB_TOKEN }}
          path: homebrew-tap

      - name: Update desktop cask
        if: github.ref_type == 'tag' && !contains(github.ref_name, '-')
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          VERSION="${VERSION#v}"
          cask="homebrew-tap/Casks/solus.rb"
          dmg="release/Solus-$VERSION-arm64.dmg"
          cp packaging/homebrew/solus.rb "$cask"
          sha=$(shasum -a 256 "$dmg" | cut -d' ' -f1)
          VERSION="$VERSION" SHA="$sha" ruby -pi -e '
            gsub(/^  version "[^"]*"$/, "  version \"#{ENV.fetch("VERSION")}\"")
            gsub(/^  sha256 "[^"]*"$/, "  sha256 \"#{ENV.fetch("SHA")}\"")
          ' "$cask"

      - name: Commit and push cask
        if: github.ref_type == 'tag' && !contains(github.ref_name, '-')
        run: |
          cd homebrew-tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "Cask already up to date; nothing to commit."
            exit 0
          fi
          git add Casks/solus.rb
          git commit -m "solus ${GITHUB_REF_NAME#v}"
          for attempt in 1 2 3; do
            if git push; then
              exit 0
            fi
            git pull --rebase
          done
          exit 1

      - name: Cleanup keychain
        if: always() && github.ref_type == 'tag'
        run: security delete-keychain $RUNNER_TEMP/build.keychain 2>/dev/null || true

  build-linux:
    needs: build-web
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    environment: CD
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag && format('refs/tags/{0}', inputs.release_tag) || github.sha }}
      - uses: oven-sh/setup-bun@v2
      - name: Install desktop libraries
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-0 libnss3 libgbm1 libasound2 libsecret-1-0 xvfb zsh tmux
      - name: Install Vulkan SDK for the voice helper
        uses: humbletim/install-vulkan-sdk@e7d6e7b937bde4503c7ba5c9584c9dc68f44c4b8
        with:
          version: ${{ env.VULKAN_SDK_VERSION }}
          cache: true
      - run: bun install --frozen-lockfile
      - name: Setup Rust for the resource monitor
        uses: dtolnay/rust-toolchain@stable
      - name: Linux desktop unit checks
        run: bun scripts/test-unit.ts desktop-package desktop-linux-window desktop-secret-storage desktop-capture desktop-update-mode terminal-launcher cli-env account-store desktop-update-status
      - *voice-image
      - *voice-cache
      - *download-web
      - name: Build and package desktop
        env:
          NODE_OPTIONS: --max-old-space-size=4096
          SOLUS_VOICE_CACHE_HIT: ${{ steps.voice-cache.outputs.cache-hit }}
          SOLUS_GOOGLE_CLIENT_ID: ${{ (github.ref_type == 'tag' || inputs.release_tag) && secrets.SOLUS_GOOGLE_CLIENT_ID || '' }}
          SOLUS_GOOGLE_CLIENT_SECRET: ${{ (github.ref_type == 'tag' || inputs.release_tag) && secrets.SOLUS_GOOGLE_CLIENT_SECRET || '' }}
          SOLUS_GITHUB_CLIENT_ID: ${{ (github.ref_type == 'tag' || inputs.release_tag) && secrets.SOLUS_GITHUB_CLIENT_ID || '' }}
          SOLUS_ATLASSIAN_CLIENT_ID: ${{ (github.ref_type == 'tag' || inputs.release_tag) && secrets.SOLUS_ATLASSIAN_CLIENT_ID || '' }}
          SOLUS_ATLASSIAN_CLIENT_SECRET: ${{ (github.ref_type == 'tag' || inputs.release_tag) && secrets.SOLUS_ATLASSIAN_CLIENT_SECRET || '' }}
        run: |
          /usr/bin/time -f 'Desktop bundle: %e seconds, %M KiB peak RSS' bun run build:desktop --mode production
          /usr/bin/time -f 'Linux packaging: %e seconds, %M KiB peak RSS' bun run electron-builder --linux --x64 --publish never
      - name: Verify packaged desktop
        run: xvfb-run -a node scripts/verify-linux-desktop.mjs x11 release/linux-unpacked/solus
      - name: Save Linux packages
        uses: actions/upload-artifact@v4
        with:
          name: linux-release
          if-no-files-found: error
          path: |
            release/*.AppImage
            release/*.deb
            release/*-linux.yml
            release/*.blockmap

  # Publish from saved artifacts so an upload failure does not require a new build.
  publish-linux:
    needs: [build-mac, build-linux]
    if: ${{ !cancelled() && needs.build-linux.result == 'success' && (inputs.release_tag || github.ref_type == 'tag' && needs.build-mac.result == 'success') }}
    runs-on: ubuntu-22.04
    environment: CD
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: linux-release
          path: release
      - name: Upload Linux feed and packages
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: |
          for f in release/*.AppImage release/*.deb release/*-linux.yml release/*.blockmap; do
            [ -f "$f" ] || continue
            aws s3 cp "$f" "s3://solus-releases/$(basename "$f")" --endpoint-url "https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          done
          for f in release/*-x86_64.AppImage; do
            [ -f "$f" ] || continue
            aws s3 cp "$f" "s3://solus-releases/Solus-latest-x86_64.AppImage" --endpoint-url "https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          done
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          files: |
            release/*.AppImage
            release/*.deb

  # docs/plans/windows.md §5.12. Unsigned until code signing lands (§10 decision 5).
  # electron-builder writes latest.yml beside latest-mac.yml on the same feed.
  build-windows:
    needs: build-web
    runs-on: windows-latest
    timeout-minutes: 60
    environment: CD
    defaults:
      run:
        shell: bash
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag && format('refs/tags/{0}', inputs.release_tag) || github.sha }}
      - uses: oven-sh/setup-bun@v2
      - name: Install Vulkan SDK for the voice helper
        uses: humbletim/install-vulkan-sdk@e7d6e7b937bde4503c7ba5c9584c9dc68f44c4b8
        with:
          version: ${{ env.VULKAN_SDK_VERSION }}
          cache: true
      - run: bun install --frozen-lockfile
      - name: Setup Rust for the resource monitor
        uses: dtolnay/rust-toolchain@stable
      - name: Windows desktop unit checks
        run: bun scripts/test-unit.ts desktop-package windows-desktop desktop-capture desktop-update-mode terminal-launcher cli-env keybindings
      - *voice-image
      - *voice-cache
      - *download-web
      - name: Build and package desktop
        env:
          NODE_OPTIONS: --max-old-space-size=4096
          SOLUS_VOICE_CACHE_HIT: ${{ steps.voice-cache.outputs.cache-hit }}
          SOLUS_GOOGLE_CLIENT_ID: ${{ (github.ref_type == 'tag' || inputs.release_tag) && secrets.SOLUS_GOOGLE_CLIENT_ID || '' }}
          SOLUS_GOOGLE_CLIENT_SECRET: ${{ (github.ref_type == 'tag' || inputs.release_tag) && secrets.SOLUS_GOOGLE_CLIENT_SECRET || '' }}
          SOLUS_GITHUB_CLIENT_ID: ${{ (github.ref_type == 'tag' || inputs.release_tag) && secrets.SOLUS_GITHUB_CLIENT_ID || '' }}
          SOLUS_ATLASSIAN_CLIENT_ID: ${{ (github.ref_type == 'tag' || inputs.release_tag) && secrets.SOLUS_ATLASSIAN_CLIENT_ID || '' }}
          SOLUS_ATLASSIAN_CLIENT_SECRET: ${{ (github.ref_type == 'tag' || inputs.release_tag) && secrets.SOLUS_ATLASSIAN_CLIENT_SECRET || '' }}
        run: |
          TIMEFORMAT='Desktop bundle: %R seconds'
          time bun run build:desktop --mode production
          TIMEFORMAT='Windows packaging: %R seconds'
          time bun run electron-builder --win --x64 --publish never
      - name: Save Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: windows-release
          if-no-files-found: error
          path: |
            release/*.exe
            release/latest.yml
            release/*.exe.blockmap

  publish-windows:
    needs: [build-mac, build-windows]
    if: ${{ !cancelled() && needs.build-windows.result == 'success' && (inputs.release_tag || github.ref_type == 'tag' && needs.build-mac.result == 'success') }}
    runs-on: ubuntu-22.04
    environment: CD
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: windows-release
          path: release
      - name: Upload Windows feed and installer
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: |
          for f in release/*.exe release/latest.yml release/*.exe.blockmap; do
            [ -f "$f" ] || continue
            aws s3 cp "$f" "s3://solus-releases/$(basename "$f")" --endpoint-url "https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          done
          for f in release/Solus-*-x64.exe; do
            [ -f "$f" ] || continue
            aws s3 cp "$f" "s3://solus-releases/Solus-latest-x64.exe" --endpoint-url "https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          done
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          files: release/*.exe
