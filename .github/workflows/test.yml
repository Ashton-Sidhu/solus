name: Test

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch makes the in-flight run obsolete. Cancel it
# instead of paying for a build whose result nobody will read.
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      # setup-bun caches the bun binary, not the packages it downloads. Without
      # these, every run refetches the whole dependency set plus the ~100 MB
      # Electron binary that `postinstall` pulls down.
      - name: Cache dependency downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
          key: deps-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            deps-${{ runner.os }}-${{ runner.arch }}-

      - name: Install dependencies
        run: bun run qa setup

      # A failure keeps CI red, while later QA steps still collect evidence.
      # The unit runner gives each file a fresh process and a deadline so module
      # mocks cannot leak between files and stalled workers cannot outlive the run.
      - name: Run unit tests
        run: |
          set -o pipefail
          bun run test:unit 2>&1 | tee .solus-local/unit-tests.log

      - name: Build app
        if: ${{ !cancelled() }}
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: bun run build

      - name: Check QA tooling types and lint
        if: ${{ !cancelled() }}
        run: |
          bun run check:qa
          bun run oxlint scripts/qa scripts/agent apps/standalone-server/src/index.ts packages/server/src/logger.ts
          bun run lint:rules

      # These checks expose the existing repository debt without claiming it passed.
      # The focused QA checks above are required. Remove continue-on-error when the
      # repository-wide baseline is fixed; its output remains an uploaded artifact.
      - name: Report repository type and lint baseline
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: bun run qa check > .solus-local/check-output.log 2>&1

      - name: Install Chromium for isolated web QA
        if: ${{ !cancelled() }}
        run: bun run playwright install chromium

      - name: Build deterministic QA app
        if: ${{ !cancelled() }}
        run: bun run build:test

      - name: Run bounded web, mobile, and native smoke
        if: ${{ !cancelled() }}
        run: bun run qa smoke

      - name: Upload QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-evidence
          if-no-files-found: warn
          include-hidden-files: true
          path: |
            .solus-local/reports/smoke/
            .solus-local/reports/smoke-results/
            playwright-report/
            test-results/
            .solus-local/unit-tests.log
            .solus-local/checks.json
            .solus-local/check-output.log
            .solus-local/runs/*/run.json
            .solus-local/runs/*/validation.json
            .solus-local/runs/*/report.json
            .solus-local/runs/*/logs/**/*.log
            .solus-local/runs/*/history/**/*.json
            dist/build-identity.json
            dist/test/build-identity.json
