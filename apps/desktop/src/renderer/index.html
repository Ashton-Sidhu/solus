<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Solus</title>
    <!--
      Resolve the persisted theme before any module loads so the boot shell (and
      the app that replaces it) paints in the right mode with no light/dark flash.
      Mirrors settings.context's resolution: themeMode 'system' (default) | 'light' |
      'dark'. It only toggles the class so theme colors stay owned by the app.
    -->
    <script>
      (function () {
        try {
          var mode = 'system'
          var profile = 'solus.personal-settings.v1:'
          var account = localStorage.getItem('solus.personal-settings.active')
          var raw = (account && localStorage.getItem(profile + account)) || localStorage.getItem(profile + 'anonymous')
          if (raw) {
            var parsed = JSON.parse(raw)
            if (
              parsed &&
              (parsed.themeMode === 'system' ||
                parsed.themeMode === 'light' ||
                parsed.themeMode === 'dark')
            ) mode = parsed.themeMode
          }
          var isDark =
            mode === 'light'
              ? false
              : mode === 'system'
                ? matchMedia('(prefers-color-scheme: dark)').matches
                : true
          var el = document.documentElement
          el.classList.toggle('dark', isDark)
          el.classList.toggle('light', !isDark)
          el.style.setProperty('color-scheme', isDark ? 'dark' : 'light')
        } catch (e) {}
      })()
    </script>
  </head>
  <body style="background: transparent !important;">
    <!-- scripts/vite-boot-splash.ts writes the boot splash into #root. main.ts
         removes it when the app mounts. On a boot failure, boot-scene.ts draws
         its mark again. -->
    <div id="root"></div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
