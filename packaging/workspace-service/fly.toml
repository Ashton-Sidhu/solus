# The workspace service (docs/plans/cloud-service-model.md §15): the managed-host
# image booted in workspace mode. One machine behind Fly's proxy, no volume —
# every durable record is in the Postgres DATABASE_URL names. See README.md.
app = "solus-workspace"
primary_region = "iad"

[build]
  # Built and pushed by packaging/managed-host (bun scripts/managed-image.ts); the
  # same tarball a personal host installs, so one release serves every role.
  image = "registry.fly.io/solus-managed:0.32.2"

[env]
  # The image bakes SOLUS_MANAGED=1 for a managed host; a workspace service is nobody's machine.
  SOLUS_MANAGED = "0"
  SOLUS_WORKSPACE = "1"
  SOLUS_ROLES = "collaboration"
  SOLUS_HOST = "0.0.0.0"
  SOLUS_PORT = "3000"
  SOLUS_NO_LAN_DISCOVERY = "1"
  SOLUS_DATA_DIR = "/data/state"

# Secrets, set with `fly secrets set` (never here):
#   DATABASE_URL          postgres://… — one Postgres for every organization
#   SOLUS_CLOUD_ISSUER    the control plane's issuer, e.g. https://app.solus.sh
#   SOLUS_CLOUD_JWKS_URL  its key set, e.g. https://app.solus.sh/api/auth/jwks

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "20s"
    interval = "15s"
    timeout = "5s"
    method = "GET"
    path = "/health"

[[vm]]
  size = "shared-cpu-2x"
  memory = "1gb"
