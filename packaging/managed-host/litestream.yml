# Litestream for a managed host (docs/plans/managed-hosts.md §6). Only read when
# LITESTREAM_REPLICA_URL is set; the entrypoint then runs the server under
# `litestream replicate -exec`. The values are expanded from the machine's
# environment, which the control plane sets per host.
#
#   LITESTREAM_REPLICA_URL        s3://<bucket>/<per-host prefix>
#   LITESTREAM_REPLICA_ENDPOINT   https://<account>.r2.cloudflarestorage.com (R2 and other S3-compatible stores)
#   LITESTREAM_ACCESS_KEY_ID
#   LITESTREAM_SECRET_ACCESS_KEY
dbs:
  - path: /data/state/solus.db
    replicas:
      - type: s3
        url: ${LITESTREAM_REPLICA_URL}
        endpoint: ${LITESTREAM_REPLICA_ENDPOINT}
        access-key-id: ${LITESTREAM_ACCESS_KEY_ID}
        secret-access-key: ${LITESTREAM_SECRET_ACCESS_KEY}
        # R2 has no region; the S3 client still wants one named.
        region: auto
        force-path-style: true
        sync-interval: 1s
