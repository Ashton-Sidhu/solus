# The Solus API (docs/plans/cloud-service-model.md §15): the managed-host
# image booted in API mode. One machine behind Fly's proxy, no volume —
# every durable record is in the Postgres DATABASE_URL names. See README.md.
app = "solus-sh-api"
primary_region = "iad"

[build]
  # Built from packaging/managed-host and pushed to this app's own repository by
  # `bun run release:api`; the same tarball a personal host installs.
  # The digest is the one Fly's registry reports for the machine after the deploy
  # (`fly machine list --json`), not the one `docker push` prints: Fly stores its
  # own manifest for a pushed image. Tag: solus-sh-api:0.34.1-20260930-211841.
  image = "registry.fly.io/solus-sh-api@sha256:f0714418e70af90cb443586516487f944a84a34c005c98b1f9b8a9ac1ddce20d"

[env]
  SOLUS_API = "1"
  SOLUS_ROLES = "collaboration"
  SOLUS_HOST = "0.0.0.0"
  SOLUS_PORT = "3000"
  SOLUS_NO_LAN_DISCOVERY = "1"
  SOLUS_DATA_DIR = "/data/state"

# Secrets, set with `fly secrets set` (never here):
#   DATABASE_URL          postgres://… — one Postgres for every organization
#   SOLUS_CLOUD_ISSUER    the control plane's issuer, e.g. https://app.solus.sh
#   SOLUS_CLOUD_JWKS_URL  its key set, e.g. https://app.solus.sh/api/auth/jwks
#   SOLUS_INTEGRATION_SERVICE_KEY  equals the account Worker's INTEGRATION_SERVICE_KEY

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "20s"
    interval = "15s"
    timeout = "5s"
    method = "GET"
    path = "/health"

[[vm]]
  size = "shared-cpu-2x"
  memory = "1gb"
